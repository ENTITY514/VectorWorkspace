              - paragraph [ref=e86]: Курс повышения квалификации для учителей математики 5–9 классов состоит из двух взаимосвязанных частей, каждая из которых решает отдельную, но стратегически важную профессиональную задачу педагога. Первая часть курса направлена на развитие предметной компетенции учителей математики и углублённую проработку сложных тем школьной программы. В рамках этой части участники системно работают с текстовыми задачами, теорией чисел, планиметрией, квадратными уравнениями и неравенствами, элементами тригонометрии, а также осваивают практико-ориентированные подходы к решению задач. Отдельное внимание уделяется использованию ИКТ, микрообучению и организации внеурочных форм работы — математических недель и регат — как инструментов повышения мотивации учащихся и интереса к предмету.
              - paragraph [ref=e87]: Вторая часть курса фокусируется на формировании функциональной грамотности учащихся с акцентом на читательскую и математическую грамотность. Педагоги учатся анализировать математические задания с позиции PISA, работать с текстами, таблицами, графиками и жизненными контекстами, конструировать задания разного уровня сложности и оценивать их качество. Курс помогает учителю осознанно связывать математическое содержание с реальными ситуациями, развивать у учащихся навыки анализа, интерпретации данных и применения математических знаний на практике, превращая урок математики в инструмент развития мышления и функциональной грамотности.
