            - paragraph [ref=f3e3897]: Поздравляем вас с успешным завершением нашего образовательного курса. Теперь перед вами стоит важный этап — получение сертификата, подтверждающего ваше обучение.
            - list [ref=f3e3898]:
              - listitem [ref=f3e3899]:
                - paragraph [ref=f3e3900]: "Фиксация вашего прогресса: После того как вы завершили все видеоуроки и выполнили необходимые задания, ваш прогресс автоматически зафиксируется в системе данной платформы но НЕ ВЫДАСТ вам ОФИЦИАЛЬНЫЙ сертификат. Это только первый шаг к получению сертификата."
              - listitem [ref=f3e3901]:
                - paragraph [ref=f3e3902]: "Связь с нашим центром: Для оформления официального сертификата, вам необходимо связаться с нашим центром повышения квалификации по номеру телефона - +7 777 897 05 05. Обязательно проверьте номер на официальном сайте USTAZ.PRO для избежания ошибок."
              - listitem [ref=f3e3903]:
                - paragraph [ref=f3e3904]: "Необходимые данные:"
                - list [ref=f3e3905]:
                  - listitem [ref=f3e3906]:
                    - paragraph [ref=f3e3907]: Фамилия, имя, отчество в точном написании, как в удостоверении личности.
                  - listitem [ref=f3e3908]:
                    - paragraph [ref=f3e3909]: ИИН — ваш индивидуальный идентификационный номер. Точность введения этого номера критична для корректного отображения вашего обучения на платформе “Ұстаз”.
              - listitem [ref=f3e3910]:
                - paragraph [ref=f3e3911]: "Процесс проверки и оформления:"
                - list [ref=f3e3912]:
                  - listitem [ref=f3e3913]:
                    - paragraph [ref=f3e3914]: Мы проверим статус завершения вашего курса и убедимся, что все задания выполнены.
                  - listitem [ref=f3e3915]:
                    - paragraph [ref=f3e3916]: После итоговой сверки ваши данные будут внесены в Единую базу данных педагогов.
                  - listitem [ref=f3e3917]:
                    - paragraph [ref=f3e3918]: Ваш сертификат будет оформлен согласно требованиям и отправлен вам на WhatsApp.
              - listitem [ref=f3e3919]:
                - paragraph [ref=f3e3920]: "Важные напоминания:"
