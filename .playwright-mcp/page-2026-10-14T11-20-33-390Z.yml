                      - strong [ref=f3e3925]: вы связались с нами
                      - text: через WhatsApp сразу после его окончания - +7 777 897 05 05. Это сигнал для нас начать процесс оформления вашего сертификата.
            - paragraph [ref=f3e3926]: Мы гарантируем, что ваши усилия будут оценены по достоинству и вы получите сертификат, который можно будет использовать при аттестации.
